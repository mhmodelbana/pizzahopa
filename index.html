  const client = window.supabase?.createClient ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY) : null;
  async function publicApi(action, payload={}) {
    const {data, error} = await client.functions.invoke('hopa-public-api', {body:{action, ...payload}});
    if (error) {
      let detail = '';
      try { const response = error.context; if (response?.clone) { const body = await response.clone().json(); detail = body?.error || ''; } } catch (_) {}
      if (error.context?.status === 429) throw new Error(detail || 'محاولات كثيرة خلال وقت قصير. حاول بعد قليل.');

  const arabicDigits='٠١٢٣٤٥٦٧٨٩', persianDigits='۰۱۲۳۴۵۶۷۸۹';
  function normalizePhone(value){return [...String(value||'')].map(ch=>{let i=arabicDigits.indexOf(ch);if(i>=0)return String(i);i=persianDigits.indexOf(ch);return i>=0?String(i):ch;}).join('').replace(/[^0-9]/g,'');}
  function randomHex(bytes=32){const data=new Uint8Array(bytes);crypto.getRandomValues(data);return [...data].map(x=>x.toString(16).padStart(2,'0')).join('');}
  async function sha256Hex(value){const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(value));return [...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('');}
  let turnstileLoadPromise=null;
  function turnstileIsConfigured(){return Boolean(TURNSTILE_SITE_KEY && !TURNSTILE_SITE_KEY.startsWith('%') && !TURNSTILE_SITE_KEY.includes('REPLACE_'));}
  function setupTurnstile(){
    const container=$('#turnstile-widget');
    if(!container||!turnstileIsConfigured())return;
    const renderWidget=()=>{
      const current=$('#turnstile-widget');if(!current||!window.turnstile)return;
      if(state.turnstileWidgetId!==null){try{window.turnstile.remove(state.turnstileWidgetId)}catch(_){}state.turnstileWidgetId=null}
      state.captchaToken='';
      state.turnstileWidgetId=window.turnstile.render(current,{sitekey:TURNSTILE_SITE_KEY,theme:'light',callback(token){state.captchaToken=token},'expired-callback'(){state.captchaToken=''},'error-callback'(){state.captchaToken='';const note=$('#turnstile-error');if(note)note.textContent='تعذر التحقق البشري. حدّث مربع التحقق وحاول مجددًا.'}});
    };
    if(window.turnstile){renderWidget();return}
    if(!turnstileLoadPromise){turnstileLoadPromise=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';script.async=true;script.defer=true;script.onload=resolve;script.onerror=()=>reject(new Error('Turnstile load failed'));document.head.appendChild(script)})}
    turnstileLoadPromise.then(renderWidget).catch(()=>{const note=$('#turnstile-error');if(note)note.textContent='تعذر تحميل التحقق البشري. تأكد من اتصال الإنترنت.'});
  }
  function persistCart(){try{localStorage.setItem('hopa_cart_v1',JSON.stringify(state.cart.map(i=>({id:i.id,productId:i.productId,size:i.size,qty:i.qty,addonIds:i.addonIds}))))}catch(_){}}
  function restoreCart(){
    try {
      const saved=JSON.parse(localStorage.getItem('hopa_cart_v1')||'[]');
      if(!Array.isArray(saved))return;
      state.cart=saved.slice(0,30).map(row=>{
        const p=productById(row.productId); if(!p||!p.is_active)return null;
        const size=String(row.size||''); const found=productSizes(p).find(x=>x.name===size);
        if(productSizes(p).length&&!found)return null;
        const addonIds=Array.isArray(row.addonIds)?[...new Set(row.addonIds.map(String))].filter(id=>addonGroupFor(p).some(a=>a.id===id)):[];
        const addons=addonGroupFor(p).filter(a=>addonIds.includes(a.id)).map(a=>({id:a.id,name:a.name,price:priceForAddon(a,size)}));
        const unitPrice=Number(found?.price||0)+addons.reduce((sum,a)=>sum+a.price,0); const qty=Math.max(1,Math.min(50,Math.trunc(Number(row.qty)||1)));
        return {id:String(row.id||randomHex(8)),productId:p.id,name:p.name,img:PRODUCT_LOGO_URL,size,qty,addonIds,addons,unitPrice,itemTotal:unitPrice*qty};
      }).filter(Boolean);
      persistCart();
    } catch (_) { state.cart=[]; }
  }
  function getSavedOrders(){try{const a=JSON.parse(localStorage.getItem('hopa_saved_orders_v1')||'[]');return Array.isArray(a)?a.filter(x=>/^HOPA-[0-9]{1,18}$/.test(x.order_number||'')&&/^[0-9a-f]{64}$/.test(x.tracking_token||'')).slice(0,10):[]}catch(_){return[]}}
  function saveTrackedOrder(order){if(!order?.order_number||!order?.tracking_token)return;const saved=[{order_number:order.order_number,tracking_token:order.tracking_token,created_at:order.created_at||new Date().toISOString()},...getSavedOrders().filter(x=>x.order_number!==order.order_number)].slice(0,10);try{localStorage.setItem('hopa_saved_orders_v1',JSON.stringify(saved))}catch(_){}}
  function trackingLink(order){const url=new URL(location.href);url.hash='track='+encodeURIComponent(order.order_number)+'&token='+encodeURIComponent(order.tracking_token);return url.toString()}
  const state = {categories:[],products:[],addons:[],settings:{delivery_fee:15,minimum_order:0,estimated_delivery_minutes:45,delivery_areas:'يتم تأكيد نطاق التوصيل مع المطعم',is_open:true},category:'cat_pizza',search:'',cart:[],modal:null,cartOpen:false,checkout:false,loading:false,orderSuccess:null,trackOrderOpen:false,editingOrderDetails:false,captchaToken:'',turnstileWidgetId:null};
  const $ = (s,root=document) => root.querySelector(s);
  const money = n => `${Number(n||0).toLocaleString('ar-EG',{maximumFractionDigits:2})} ج.م`;
  const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icon = (name, cls='w-5 h-5') => `<i data-lucide="${escapeHTML(name)}" class="${cls}"></i>`;
  function icons(){ if(window.lucide) window.lucide.createIcons(); }
  function toast(message,type='ok'){
    const root=$('#toast-root'); if(!root)return;
    const item=document.createElement('div');item.className='toast pointer-events-auto flex items-center gap-3 rounded-2xl border bg-white px-4 py-3 shadow-xl '+(type==='error'?'border-red-100':'border-stone-100');
    const badge=document.createElement('div');badge.className='w-9 h-9 rounded-xl flex items-center justify-center '+(type==='error'?'bg-red-50 text-brand':'bg-emerald-50 text-emerald-600');badge.innerHTML=icon(type==='error'?'alert-circle':'check-circle','w-5 h-5');
    const text=document.createElement('p');text.className='font-bold text-sm flex-1';text.textContent=message;item.append(badge,text);root.append(item);icons();setTimeout(()=>{item.style.opacity='0';item.style.transform='translateY(-6px)';setTimeout(()=>item.remove(),250)},3600);
  }
  function productSizes(p){return Array.isArray(p.sizes)?p.sizes:[]}
  function productById(id){return state.products.find(p=>p.id===id)}
  function addonGroupFor(p){return state.addons.filter(a=>a.group_key===p.addon_group&&a.is_active)}
  function priceForAddon(a,size){return a.price_type==='fixed'?Number(a.fixed_price||0):Number((a.size_prices||{})[size]||0)}
  function currentUnitPrice(){if(!state.modal)return 0;const {product,size,addonIds}=state.modal;const base=productSizes(product).find(s=>s.name===size);return Number(base?.price||0)+addonGroupFor(product).filter(a=>addonIds.includes(a.id)).reduce((sum,a)=>sum+priceForAddon(a,size),0)}
  function currentCount(){return state.cart.reduce((s,i)=>s+i.qty,0)}
  function subtotal(){return state.cart.reduce((s,i)=>s+i.itemTotal,0)}
  function total(){return subtotal()+(state.cart.length?Number(state.settings.delivery_fee||0):0)}
  function categoryIcon(cat){return cat.icon||'utensils'}
  function imageFallback(){return PRODUCT_LOGO_FALLBACK}
  async function loadCatalog(){
    if(!client)throw new Error('تعذر تحميل مكتبة الاتصال بـ Supabase. حدّث الصفحة وتأكد من اتصال الإنترنت.');
    const [catsRes,productsRes,addonsRes,settingsRes]=await Promise.all([
      client.from('categories').select('*').eq('is_active',true).order('sort_order'),
      client.from('products').select('*').eq('is_active',true).order('sort_order'),
      client.from('addons').select('*').eq('is_active',true).order('sort_order'),
      client.from('store_settings').select('*').eq('id',1).maybeSingle()
    ]);
    const errors=[catsRes,productsRes,addonsRes,settingsRes].filter(r=>r.error);
    if(errors.length) throw errors[0].error;
    state.categories=catsRes.data||[];state.products=productsRes.data||[];state.addons=addonsRes.data||[];state.settings=settingsRes.data||state.settings;
    if(!state.categories.some(c=>c.id===state.category))state.category=state.categories[0]?.id||'';
  }
  function render(){
    const app=$('#app');app.innerHTML=renderPage();
    if(state.modal)app.insertAdjacentHTML('beforeend',renderProductModal());
    if(state.cartOpen)app.insertAdjacentHTML('beforeend',renderCartDrawer());

  function renderEditOrderItem(item,i){
    const product=productById(item.product_id);
    const sizes=product?productSizes(product):[];
    const selected=(Array.isArray(item.addons)?item.addons:[]).map(a=>typeof a==='string'?a:a?.id).filter(Boolean);
    const addons=product?addonGroupFor(product):[];
    const sizePicker=product&&sizes.length?`<label class="block text-[10px] font-bold text-stone-500 mt-2">الحجم<select name="size_${i}" class="block w-full mt-1 rounded-lg border border-stone-200 p-2 text-xs font-bold">${sizes.map(z=>`<option value="${escapeHTML(z.name)}" ${z.name===(item.size||'')?'selected':''}>${escapeHTML(z.name)} — ${money(z.price)}</option>`).join('')}</select></label>`:`<span class="text-[10px] text-stone-400">${escapeHTML(item.size||'حجم غير متاح')}</span>`;
    const addonPicker=product?`<details class="mt-2"><summary class="cursor-pointer text-[10px] font-black text-brand">تعديل الإضافات (${addons.length})</summary><div class="grid sm:grid-cols-2 gap-2 mt-2">${addons.length?addons.map(a=>`<label class="flex items-center gap-2 rounded-lg bg-stone-50 p-2 text-[10px] font-bold"><input type="checkbox" name="addon_${i}" value="${escapeHTML(a.id)}" ${selected.includes(a.id)?'checked':''} class="accent-red-600"><span class="flex-1">${escapeHTML(a.name)}</span><span>${money(priceForAddon(a,item.size||''))}</span></label>`).join(''):'<span class="text-[10px] text-stone-400">لا توجد إضافات متاحة.</span>'}</div></details>`:`<p class="text-[10px] text-amber-700 mt-2">الصنف لم يعد نشطًا في المنيو؛ لا يمكن إعادة تسعيره بأمان من هنا.</p>`;
    return `<div class="flex gap-3 items-start justify-between border-b border-stone-100 pb-3 last:border-0 last:pb-0"><div class="min-w-0 flex-1"><b class="block text-xs">${escapeHTML(item.product_name||item.name||'صنف')}</b>${sizePicker}${addonPicker}</div><label class="text-[10px] font-bold text-stone-500 shrink-0">الكمية<input aria-label="كمية ${escapeHTML(item.product_name||item.name||'الصنف')}" type="number" name="qty_${i}" min="0" max="50" step="1" value="${Number(item.quantity||1)}" class="block w-20 mt-1 rounded-lg border border-stone-200 p-2 text-center font-black text-sm"></label></div>`;
  }
  function renderOrderSuccess(){

    const cancelled=current==='ملغي';
    const canChange=current==='استلمنا طلبك';
    const items=Array.isArray(o.items)?o.items:[];

    return `<div class="fixed inset-0 z-[10001] modal-backdrop flex items-center justify-center p-3 sm:p-5" role="dialog" aria-modal="true" aria-label="تفاصيل وتتبع الطلب">
      <section class="bg-white rounded-[28px] w-full max-w-2xl max-h-[94dvh] overflow-y-auto shadow-2xl">
        <div class="sticky top-0 z-10 bg-white/95 backdrop-blur border-b border-stone-100 p-5 sm:p-7 flex items-start gap-3">
          <div class="w-12 h-12 rounded-2xl ${cancelled?'bg-red-50 text-red-600':'bg-emerald-50 text-emerald-600'} flex items-center justify-center shrink-0">${icon(cancelled?'x-circle':'package-check','w-7 h-7')}</div>
          <div class="flex-1 min-w-0"><p class="text-xs font-black ${cancelled?'text-red-600':'text-emerald-700'} mb-1">${cancelled?'تم إلغاء الطلب':'طلبك مع هوبا بيتزا'}</p><h2 class="text-xl sm:text-2xl font-black">${cancelled?'الطلب ملغي':escapeHTML(current)}</h2><p class="text-xs text-stone-500 mt-1">رقم الطلب <b class="text-brand" dir="ltr">${escapeHTML(o.order_number||'—')}</b></p><p class="text-[10px] text-stone-400 mt-1">تاريخ الطلب: ${escapeHTML(o.created_at?new Date(o.created_at).toLocaleString('ar-EG'):'—')}</p>${o.tracking_token?`<button type="button" onclick="Hopa.copyTrackingLink()" class="mt-3 inline-flex items-center gap-2 rounded-xl bg-red-50 text-brand px-3 py-2 text-xs font-black">${icon('link','w-4 h-4')} نسخ رابط التتبع الآمن</button><p class="text-[10px] text-amber-700 mt-2">الرابط سري؛ احتفظ به ولا تشاركه إلا مع الشخص المعني بالطلب.</p>`:''}</div>

        </div>

  const Hopa={
    openTrackOrder(){state.trackOrderOpen=true;state.cartOpen=false;state.checkout=false;state.modal=null;render();document.body.style.overflow='hidden'},
    closeTrackOrder(){state.trackOrderOpen=false;render();document.body.style.overflow=state.orderSuccess?'hidden':''},
    async trackSavedOrder(orderNumber, trackingToken){try{const data=await publicApi('track',{order_number:orderNumber,tracking_token:trackingToken});state.trackOrderOpen=false;state.orderSuccess=data;state.editingOrderDetails=false;saveTrackedOrder(data);render();document.body.style.overflow='hidden'}catch(e){toast(e.message||'تعذر فتح الطلب','error')}},

    async trackOrder(event){
      event.preventDefault();
      const form=event.currentTarget,fd=new FormData(form);

      const errorBox=$('#track-order-error');

      if(button){button.disabled=true;button.textContent='جارٍ البحث عن الطلب...'}
      if(errorBox){errorBox.textContent='';errorBox.classList.add('hidden')}
      try{
        const data=await publicApi('track',{order_number:orderNumber,tracking_token:trackingToken});

        state.orderSuccess=data;saveTrackedOrder(data);

      }catch(error){

    toggleEditOrderDetails(value){state.editingOrderDetails=typeof value==='boolean'?value:!state.editingOrderDetails;render();document.body.style.overflow='hidden'},
    async saveOrderDetails(event){
      event.preventDefault();
      const order=state.orderSuccess;if(!order)return;
      const form=event.currentTarget,fd=new FormData(form);
      const customerName=String(fd.get('customer_name')||'').trim();
      const newPhone=String(fd.get('new_phone')||'').trim();
      const address=String(fd.get('address')||'').trim();
      const notes=String(fd.get('notes')||'').trim();
      const digits=normalizePhone(newPhone);
      const errorBox=$('#edit-order-error');
      if(customerName.length<2||digits.length<10||digits.length>15||address.length<5){if(errorBox){errorBox.textContent='راجع الاسم ورقم الهاتف والعنوان.';errorBox.classList.remove('hidden')}return}
      const updatedItems=(Array.isArray(order.items)?order.items:[]).map((item,i)=>{
        const product=productById(item.product_id);
        const size=product?String(fd.get(`size_${i}`)??item.size??''):String(item.size||'');
        const priorAddons=Array.isArray(item.addons)?item.addons.map(a=>typeof a==='string'?a:a?.id).filter(Boolean):[];
        const addonIds=product?fd.getAll(`addon_${i}`).map(String).filter(id=>addonGroupFor(product).some(a=>a.id===id)):priorAddons;

      }).filter(item=>item.quantity>0);

      if(updatedItems.some(item=>!Number.isInteger(item.quantity)||item.quantity>50)||updatedItems.length>30){if(errorBox){errorBox.textContent='راجع كميات الأصناف؛ الكمية من 1 إلى 50 وبحد أقصى 30 صنفًا.';errorBox.classList.remove('hidden')}return}

        state.orderSuccess={...data,phone:data.phone||newPhone};state.editingOrderDetails=false;render();document.body.style.overflow='hidden';toast('تم حفظ تعديلات الطلب بنجاح');
      }catch(error){

        const box=$('#edit-order-error');if(box){box.textContent=error?.message||'تعذر حفظ التعديلات. حاول تاني.';box.classList.remove('hidden')}
        const current=$('#edit-order-details-form')?.querySelector('button[type="submit"]');if(current){current.disabled=false;current.textContent='حفظ التعديلات'}
      }

    async submitOrder(event){
      event.preventDefault();
      if(state.loading||!state.cart.length)return;
      const form=event.currentTarget,fd=new FormData(form);
      const customer={name:String(fd.get('name')||'').trim(),phone:normalizePhone(String(fd.get('phone')||'')),address:String(fd.get('address')||'').trim(),notes:String(fd.get('notes')||'').trim()};
      const digits=customer.phone;
      if(!state.settings.is_open){toast('المطعم مغلق حاليًا ولا يستقبل طلبات جديدة.','error');return}
      if(state.cart.reduce((sum,item)=>sum+Number(item.itemTotal||0),0)<Number(state.settings.minimum_order||0)){toast(`الحد الأدنى للطلب ${money(state.settings.minimum_order)} قبل رسوم التوصيل.`,'error');return}
      if(customer.name.length<2||digits.length<10||digits.length>15||customer.address.length<5){toast('راجع الاسم ورقم الهاتف والعنوان','error');return}
      if(turnstileIsConfigured()&&!state.captchaToken){toast('أكمل التحقق البشري قبل تأكيد الطلب.','error');return}

        const items=state.cart.map(item=>({product_id:item.productId,size:item.size,quantity:item.qty,addon_ids:item.addonIds}));
        const signature=await sha256Hex(JSON.stringify({customer,items}));
        let attempt=null;
        try{const prior=JSON.parse(localStorage.getItem('hopa_pending_attempt_v1')||'null');if(prior?.signature===signature&&/^[a-f0-9]{64}$/.test(prior.tracking_token||'')&&/^[a-f0-9]{64}$/.test(prior.idempotency_key||''))attempt=prior}catch(_){}
        if(!attempt){attempt={signature,tracking_token:randomHex(32),idempotency_key:randomHex(32)};try{localStorage.setItem('hopa_pending_attempt_v1',JSON.stringify(attempt))}catch(_){}}
        const data=await publicApi('create',{p_customer_name:customer.name,p_phone:customer.phone,p_address:customer.address,p_notes:customer.notes,p_items:items,tracking_token:attempt.tracking_token,idempotency_key:attempt.idempotency_key,captcha_token:captchaToken});
        if(!data?.order_number||!data?.tracking_token)throw new Error('لم نستلم تأكيد الطلب ورمز التتبع الآمن من قاعدة البيانات.');
        state.cart=[];persistCart();state.captchaToken='';try{localStorage.removeItem('hopa_pending_attempt_v1')}catch(_){}
        state.checkout=false;state.cartOpen=false;state.loading=false;
        const fullOrder={...data,phone:data.phone||customer.phone,customer_name:data.customer_name||customer.name,address:data.address||customer.address,notes:data.notes??customer.notes,status:data.status||'استلمنا طلبك',updated_at:data.updated_at||new Date().toISOString()};
        state.orderSuccess=fullOrder;saveTrackedOrder(fullOrder);state.editingOrderDetails=false;
        render();document.body.style.overflow='hidden';toast(`تم تسجيل الطلب ${data.order_number} وإرساله للإدارة`);
      }catch(error){
        state.loading=false;render();console.error('[Hopa order]',{message:error?.message,code:error?.code,details:error?.details,hint:error?.hint,error});toast(error?.message||'حصل خطأ أثناء تسجيل الطلب. افتح Console لمعرفة التفاصيل.','error');
      }
    },
    async refreshOrderStatus(){
      if(!state.orderSuccess)return;
      let data;try{data=await publicApi('track',{order_number:state.orderSuccess.order_number,tracking_token:state.orderSuccess.tracking_token})}catch(error){const el=$('#order-status-error');if(el){el.textContent=error?.message||'مش قادرين نجيب تفاصيل الطلب دلوقتي. حاول تاني.';el.classList.remove('hidden')}return}
      state.orderSuccess={...state.orderSuccess,...data};saveTrackedOrder(state.orderSuccess);
      state.editingOrderDetails=false;render();document.body.style.overflow='hidden';toast('تم تحديث تفاصيل الطلب');
    },
    reorderPreviousOrder(){
      const order=state.orderSuccess;if(!order||!Array.isArray(order.items))return;
      const rebuilt=[];let skipped=0;
      for(const row of order.items){
        const product=productById(row.product_id);if(!product){skipped++;continue}
        const size=productSizes(product).find(z=>z.name===String(row.size||''));if(!size){skipped++;continue}
        const oldIds=(Array.isArray(row.addons)?row.addons:[]).map(a=>typeof a==='string'?a:a?.id).filter(Boolean);
        const chosen=addonGroupFor(product).filter(a=>oldIds.includes(a.id)).map(a=>({id:a.id,name:a.name,price:priceForAddon(a,size.name)}));
        const qty=Math.max(1,Math.min(50,Math.trunc(Number(row.quantity)||1)));
        const unitPrice=Number(size.price)+chosen.reduce((n,a)=>n+a.price,0);
        rebuilt.push({id:randomHex(16),productId:product.id,name:product.name,img:PRODUCT_LOGO_URL,size:size.name,qty,addonIds:chosen.map(a=>a.id),addons:chosen,unitPrice,itemTotal:unitPrice*qty});
      }
      if(!rebuilt.length){toast('الأصناف القديمة لم تعد متاحة بالمنيو الحالية.','error');return}
      state.cart=rebuilt.slice(0,30);persistCart();state.orderSuccess=null;state.editingOrderDetails=false;state.cartOpen=true;state.checkout=false;render();document.body.style.overflow='hidden';toast(skipped?`تم تجهيز إعادة الطلب مع تخطي ${skipped} صنف غير متاح`:'تم تجهيز نفس الطلب بالأسعار الحالية');
    },
    closeOrderSuccess(){state.orderSuccess=null;state.editingOrderDetails=false;document.body.style.overflow=state.trackOrderOpen?'hidden':'';render()}

  };
  window.Hopa=Hopa;
  async function start(){try{state.loading=true;if(!client)throw new Error('تعذر تحميل مكتبة الاتصال بـ Supabase. تأكد من الإنترنت ثم حدّث الصفحة.');await loadCatalog();restoreCart();state.loading=false;render();if(location.hash.startsWith('#track=')){const params=new URLSearchParams(location.hash.slice(1));const number=params.get('track')||'';const token=params.get('token')||'';if(number&&token){try{const order=await publicApi('track',{order_number:number,tracking_token:token});state.orderSuccess=order;state.trackOrderOpen=false;saveTrackedOrder(order);render();document.body.style.overflow='hidden'}catch(e){toast('رابط التتبع غير صالح أو انتهت صلاحية الطلب.','error')}}}}catch(error){state.loading=false;state.categories=[];state.products=[];state.addons=[];render();console.error('[Hopa catalog]',error);toast('تعذر الاتصال بقاعدة البيانات. تأكد من تنفيذ ملفات SQL حسب تعليمات README-AR.md.', 'error')}finally{const loader=$('#loader');loader.style.opacity='0';setTimeout(()=>loader.remove(),350)}}
  document.addEventListener('DOMContentLoaded',start);
})();
</script>
